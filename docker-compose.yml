services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/bankdb123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  loader:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      EMBEDDING_MODEL_NAME: djovak/embedic-base
      HF_HOME: /model_cache/huggingface
      TRANSFORMERS_CACHE: /model_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /model_cache/sentence_transformers
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN}
      HF_TOKEN: ${HUGGINGFACE_HUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./rezultati:/app/rezultati
      - ./model_cache:/model_cache
    profiles:
      - loader

volumes:
  pgdata:
  neo4jdata:
